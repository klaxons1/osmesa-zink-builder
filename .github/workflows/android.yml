name: Fast Build ANGLE for Android (ARM 32-bit Only)

on:
  [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: "Build ANGLE for ARM 32-bit"
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git python3 curl ninja-build

      - name: Setup Depot Tools and Bootstrap ANGLE (MONOLITHIC RUN)
        run: |
          # 1. Локально разворачиваем depot_tools прямо в рабочее окружение
          git clone --depth 1 https://googlesource.com $GITHUB_WORKSPACE/depot_tools
          
          # Настраиваем переменные путей и отключаем сбор метрик Google
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          export DEPOT_TOOLS_METRICS=0
          
          # 2. Скачиваем актуальный исходный код ANGLE
          mkdir angle-build && cd angle-build
          fetch --no-history --no-bootstrap angle
          
          cd angle
          
          # 3. Синхронизируем зависимости (без тяжелых тестов dEQP и истории изменений)
          gclient sync --no-history --shallow --nohooks
          
          # 4. Выкачиваем официальный Android NDK / SDK от Google
          gclient runhooks

      - name: Generate Build Files (GN)
        run: |
          # Подключаем ранее скачанный depot_tools к текущему шагу
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          cd angle-build/angle
          
          # Генерируем конфигурацию компиляции под 32-битный ARM
          gn gen out/Android --args="
            target_os=\"android\"
            target_cpu=\"arm\"
            is_debug=false
            dcheck_always_on=false
            angle_build_all=false
            angle_enable_vulkan=true
            angle_enable_gl=false
            is_component_build=false
            symbol_level=0
            strip_absolute_paths_from_debug_symbols=true
          "

      - name: Compile Libraries (MAX THREADS)
        run: |
          export PATH="$GITHUB_WORKSPACE/depot_tools:$PATH"
          cd angle-build/angle
          
          # Компилируем libEGL и libGLESv2 на всех ядрах виртуальной машины
          CORES=$(nproc)
          ninja -C out/Android -j $CORES libEGL libGLESv2

      - name: Upload ANGLE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angle_arm32
          path: |
            angle-build/angle/out/Android/lib.unstripped/libEGL.so
            angle-build/angle/out/Android/lib.unstripped/libGLESv2.so
