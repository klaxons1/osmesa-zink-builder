name: Fast Build ANGLE for Android (ARM 32-bit Only)

on:
  [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: "Build ANGLE for ARM 32-bit"
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git python3 curl ninja-build

      - name: Setup Google Depot Tools (Automated Action)
        # Используем проверенный готовый экшен сообщества для интеграции depot_tools
        uses: patchw/setup-depot-tools@v1

      - name: Bootstrap ANGLE Source (SPEED OPTIMIZED)
        run: |
          export DEPOT_TOOLS_METRICS=0
          
          mkdir angle-build && cd angle-build
          
          # Скачиваем только актуальный срез кода ANGLE без гигабайт истории коммитов
          fetch --no-history --no-bootstrap angle
          
          cd angle
          
          # Синхронизируем зависимости в режиме shallow (без лишней истории Git)
          gclient sync --no-history --shallow --nohooks
          
          # Скачиваем официальный Android NDK и SDK, необходимые для компиляции
          gclient runhooks

      - name: Generate Build Files (GN)
        run: |
          cd angle-build/angle
          
          # Жестко фиксируем сборку под 32-битный ARM (target_cpu="arm")
          gn gen out/Android --args="
            target_os=\"android\"
            target_cpu=\"arm\"
            is_debug=false
            dcheck_always_on=false
            angle_build_all=false
            angle_enable_vulkan=true
            angle_enable_gl=false
            is_component_build=false
            symbol_level=0
            strip_absolute_paths_from_debug_symbols=true
          "

      - name: Compile Libraries (MAX THREADS)
        run: |
          cd angle-build/angle
          
          # Задействуем все доступные процессорные ядра виртуальной машины GitHub
          CORES=$(nproc)
          ninja -C out/Android -j $CORES libEGL libGLESv2

      - name: Upload ANGLE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angle_arm32
          path: |
            angle-build/angle/out/Android/lib.unstripped/libEGL.so
            angle-build/angle/out/Android/lib.unstripped/libGLESv2.so
