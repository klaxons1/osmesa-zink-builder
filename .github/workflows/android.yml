name: Pure Direct Build ANGLE

on:
  [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: "Direct Compile ARM32"
    runs-on: ubuntu-latest

    steps:
      - name: Hard Reset GitHub Cache and Free Disk Space
        run: |
          # Force purge the runner's internal git and action cache layers
          rm -rf .git
          rm -rf .github/workflows/*cache*
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Install Tools and Android NDK
        run: |
          sudo apt update
          sudo apt install -y git python3 curl ninja-build generate-ninja

      - name: Clone ANGLE Dynamically (Cache Evading)
        run: |
          # We break the string dynamically so GitHub's parser cannot fetch a cached regex match
          TARGET_URL="https://github.com"
          TARGET_REPO="/google/angle.git"
          
          git clone --depth 1 "${TARGET_URL}${TARGET_REPO}" angle-src
          cd angle-src
          
          # Clone the required Vulkan dependencies for compilation
          git clone --depth 1 https://googlesource.com third_party/vulkan-deps
          git clone --depth 1 https://googlesource.com third_party/glslang
          git clone --depth 1 https://googlesource.com third_party/spirv-tools

      - name: Generate GN Config
        run: |
          cd angle-src
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk-bundle"
          
          gn gen out/Android --args="
            target_os=\"android\"
            target_cpu=\"arm\"
            is_debug=false
            dcheck_always_on=false
            angle_build_all=false
            angle_enable_vulkan=true
            angle_enable_gl=false
            is_component_build=false
            symbol_level=0
            android_ndk_root=\"$ANDROID_NDK_HOME\"
          "

      - name: Compile
        run: |
          cd angle-src
          ninja -C out/Android -j $(nproc) libEGL libGLESv2

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: angle_arm32_fixed
          path: |
            angle-src/out/Android/lib.unstripped/libEGL.so
            angle-src/out/Android/lib.unstripped/libGLESv2.so
